name: Ubuntu LTS

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - apps/effectcraft/**
      - apps/effectcraft-cli/**
      - crates/**
      - packaging/linux/**
      - packaging/env.sh
      - .github/workflows/ubuntu.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Ubuntu ${{ matrix.ubuntu }} x86_64
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      # Keep the compatibility build affordable; production releases retain their normal LTO.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Install build, package and desktop test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config cmake \
            libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl-dev libegl-dev libegl1 libegl-mesa0 libgl1-mesa-dri libvulkan1 mesa-vulkan-drivers \
            xdg-desktop-portal xdg-desktop-portal-gtk fonts-dejavu-core \
            desktop-file-utils shared-mime-info xdg-utils libfile-mimeinfo-perl jq xvfb xauth dbus-x11
          curl -fsSL -o /tmp/nfpm.deb \
            https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          dpkg -i /tmp/nfpm.deb
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ubuntu-${{ matrix.ubuntu }}
      - name: Build and package
        run: |
          # Public package data must stay readable even when the builder's files are private.
          umask 077
          packaging/linux/package.sh --formats "deb tar"
      - name: Install and validate desktop integration
        run: |
          # Minimal Ubuntu images exclude documentation; keep this app's packaged notices
          # and README so the unprivileged readability check covers a normal desktop install.
          printf 'path-include=/usr/share/doc/effectcraft/*\n' >/etc/dpkg/dpkg.cfg.d/zz-effectcraft-docs
          apt-get install -y ./dist/release/effectcraft-*-linux-x86_64.deb
          desktop-file-validate /usr/share/applications/ai.storyteller.effectcraft.desktop
          mkdir -p /tmp/effectcraft-mime
          printf '{}\n' >/tmp/effectcraft-mime/document.ecproj
          printf '{}\n' >/tmp/effectcraft-mime/document.ecprojx
          for document in /tmp/effectcraft-mime/*; do
            test "$(xdg-mime query filetype "$document")" = application/x-effectcraft-project
          done
          ldd /usr/bin/effectcraft | tee /tmp/effectcraft-ldd.log
          ! grep -q 'not found' /tmp/effectcraft-ldd.log
      - name: Exercise a desktop window and headless conversion
        env:
          SMOKE_OUT: /tmp/effectcraft-smoke
          LIBGL_ALWAYS_SOFTWARE: "1"
          WGPU_BACKEND: gl
        run: |
          useradd --create-home effectcraft-smoke
          for resource in \
            /usr/share/applications/ai.storyteller.effectcraft.desktop \
            /usr/share/mime/packages/ai.storyteller.effectcraft.xml \
            /usr/share/metainfo/ai.storyteller.effectcraft.metainfo.xml \
            /usr/share/icons/hicolor/256x256/apps/ai.storyteller.effectcraft.png \
            /usr/share/doc/effectcraft/README.md \
            /usr/share/doc/effectcraft/NOTICE; do
            runuser -u effectcraft-smoke -- test -r "$resource"
          done
          mkdir -p /tmp/effectcraft-tar
          tar -xzf dist/release/effectcraft-*-linux-x86_64.tar.gz -C /tmp/effectcraft-tar
          for tree in /tmp/effectcraft-tar/effectcraft-*-linux-x86_64; do
            runuser -u effectcraft-smoke -- test -x "$tree/bin/effectcraft"
            runuser -u effectcraft-smoke -- test -r "$tree/share/doc/effectcraft/README.md"
            runuser -u effectcraft-smoke -- test -r "$tree/share/icons/hicolor/256x256/apps/ai.storyteller.effectcraft.png"
          done
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chown effectcraft-smoke:effectcraft-smoke "$XDG_RUNTIME_DIR"
          runuser -u effectcraft-smoke -- env XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" \
            SMOKE_OUT="$SMOKE_OUT" LIBGL_ALWAYS_SOFTWARE=1 WGPU_BACKEND=gl \
            xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- packaging/linux/smoke.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: effectcraft-ubuntu-${{ matrix.ubuntu }}
          path: |
            dist/release/*.deb
            dist/release/*.tar.gz
            /tmp/effectcraft-smoke/
          if-no-files-found: warn
          retention-days: 7
